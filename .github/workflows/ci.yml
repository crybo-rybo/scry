# Per-commit CI ring; see docs/development/quality-gates.md section 6.
#
# Live gates: the warning-clean Doxygen site plus format (pinned
# clang-format-18), core build matrix with warnings-as-errors plus complexity,
# contract tests, and the install/package-consumer audit via ci-local.sh,
# ASan/UBSan/TSan, and clang-tidy. Fuzzing, the showcase, and the local-model
# smoke live in nightly.yml.
#
# Scry's public API is C++26 reflection, so every core leg is GCC 16 from
# ppa:ubuntu-toolchain-r/test or Homebrew. Toolchains are pinned deliberately:
# compiler drift on an experimental compiler is a first-class risk.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Doxygen API site + clang-format (pinned 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install documentation and format toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz ninja-build clang-format-18
          doxygen --version
          dot -V
      - name: Build warning-clean API documentation
        run: ./scripts/ci-docs.sh
      - name: Retain generated website
        uses: actions/upload-artifact@v7.0.1
        with:
          name: scry-api-docs
          path: build/docs/html
          if-no-files-found: error
          retention-days: 14
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' |
          grep -E '^(examples|extras|include|src|tests)/' |
          xargs clang-format-18 --dry-run --Werror

  core:
    name: Core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 16
            os: ubuntu-24.04
          - name: macOS GCC 16
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CC: gcc-16
      CXX: g++-16
      # The documentation job owns the formatting gate with a pinned
      # clang-format; core legs skip it so unpinned tool versions can't skew.
      SCRY_FORMAT_CHECK: "0"
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install Linux GCC 16 toolchain
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-16 libcurl4-openssl-dev ninja-build
      - name: Install macOS GCC 16 toolchain
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          brew info gcc
          if ! command -v g++-16 >/dev/null 2>&1; then
            brew install gcc || true
          fi
          if ! command -v g++-16 >/dev/null 2>&1; then
            brew install gcc@16 || true
          fi
          if ! command -v g++-16 >/dev/null 2>&1; then
            echo "Homebrew did not provide g++-16 on this runner" >&2
            exit 1
          fi
          g++-16 --version
      - name: Install complexity checker
        run: python3 -m pip install --user --break-system-packages lizard==1.22.1
      - name: Run local-equivalent CI
        run: ./scripts/ci-local.sh

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7.0.0
      - run: >
          sudo apt-get update &&
          sudo apt-get install -y
          clang-18 clang-tidy-18 libcurl4-openssl-dev ninja-build
      - name: Configure
        # SCRY_CLANG_TOOLING builds only the portable C++23 implementation,
        # which is the whole Clang-analyzable surface; the ci preset pins
        # g++-16, so the compiler is named explicitly here.
        run: >
          cmake --preset ci
          -B build/tidy
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DSCRY_CLANG_TOOLING=ON
          -DSCRY_ENABLE_CLANG_TIDY=ON
          -DSCRY_ENABLE_FORMAT_CHECK=OFF
      - name: Analyze
        run: cmake --build build/tidy

  sanitizers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            preset: asan
            cc: gcc-16
            cxx: g++-16
            packages: g++-16 libcurl4-openssl-dev ninja-build
            extra_cmake_flags: ""
            ctest_flags: ""
          - name: TSan
            preset: tsan
            cc: gcc-16
            cxx: g++-16
            packages: g++-16 libcurl4-openssl-dev ninja-build
            # TSan is where nondeterminism shows up; the repeat runs live here
            # (QA-008) instead of on every leg.
            extra_cmake_flags: ""
            ctest_flags: --repeat until-fail:3
          # Every fuzz target builds and replays its checked-in seed corpus
          # per pull request (QA-015), so the targets cannot rot between the
          # long scheduled runs. Toolchain pins match nightly.yml's long-fuzz
          # job because libFuzzer needs the matching clang runtime.
          - name: Fuzz corpus replay (ASan + UBSan)
            preset: fuzz
            cc: clang-21
            cxx: clang++-21
            packages: >-
              clang-21 g++-14 libclang-rt-21-dev libcurl4-openssl-dev
              libfuzzer-21-dev ninja-build
            extra_cmake_flags: -DSCRY_FUZZ_RUNS=0
            ctest_flags: -R 'fuzz$'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Add the pinned LLVM repository
        # Only the fuzz replay leg needs clang-21 and its libFuzzer runtime;
        # the same pin as nightly.yml's long-fuzz job.
        if: matrix.preset == 'fuzz'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
      - name: Add the GCC 16 toolchain repository
        if: matrix.preset != 'fuzz'
        run: sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
      - name: Install sanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Lower ASLR entropy for sanitizers
        # High-entropy ASLR (vm.mmap_rnd_bits=32) breaks ASan/TSan
        # shadow-memory mapping on Ubuntu 24.04 runners.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - run: |
          cmake --preset ${{ matrix.preset }} ${{ matrix.extra_cmake_flags }}
          cmake --build build/${{ matrix.preset }}
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure \
            ${{ matrix.ctest_flags }}

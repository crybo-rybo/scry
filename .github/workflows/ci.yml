# Per-commit CI ring; see docs/contributing.md.
#
# Live gates: the warning-clean Doxygen site plus format (pinned
# clang-format-18), core build matrix with warnings-as-errors plus complexity,
# contract tests, and the install/package-consumer audit via ci-local.sh,
# ASan/UBSan/TSan, clang-tidy, and fuzz corpus replay. Long fuzz runs, the
# showcase, and the local-model smoke live in nightly.yml.
#
# The main build and analysis gates share scripts with preflight; the hosted
# documentation job also runs the pinned clang-format check. Scry's public API is C++26
# reflection, so every core leg is GCC 16 from ppa:ubuntu-toolchain-r/test
# (the gcc16-env composite action) or Homebrew. Toolchains are pinned
# deliberately: compiler drift on an experimental compiler is a first-class
# risk, and third-party actions are pinned to commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: Doxygen API site + clang-format (pinned 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install documentation and format toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz ninja-build clang-format-18
          doxygen --version
          dot -V
      - name: Build warning-clean API documentation
        run: ./scripts/ci-docs.sh
      - name: Retain generated website
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scry-api-docs
          path: build/docs/html
          if-no-files-found: error
          retention-days: 14
      - name: Check formatting
        env:
          CLANG_FORMAT: clang-format-18
        run: ./scripts/format.sh --check

  core:
    name: Core (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 16
            os: ubuntu-24.04
          - name: macOS GCC 16
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux GCC 16 environment
        if: runner.os == 'Linux'
        uses: ./.github/actions/gcc16-env
      - name: Install macOS GCC 16 toolchain
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          brew info gcc
          if ! command -v g++-16 >/dev/null 2>&1; then
            brew install gcc || true
          fi
          if ! command -v g++-16 >/dev/null 2>&1; then
            brew install gcc@16 || true
          fi
          if ! command -v g++-16 >/dev/null 2>&1; then
            echo "Homebrew did not provide g++-16 on this runner" >&2
            exit 1
          fi
          g++-16 --version
      - name: Install complexity checker
        run: python3 -m pip install --user --break-system-packages lizard==1.24.0
      - name: Run local-equivalent CI
        run: ./scripts/ci-local.sh

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          sudo apt-get update &&
          sudo apt-get install -y
          clang-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev
          libcurl4-openssl-dev ninja-build
      - name: Analyze
        # Ubuntu 24.04 ships a libstdc++ whose <expected> clang 18 cannot
        # parse, so this leg analyzes against libc++.
        run: ./scripts/ci-tidy.sh -DSCRY_CLANG_TOOLING_LIBCXX=ON

  sanitizers:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            leg: asan
          - name: TSan
            leg: tsan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the GCC 16 environment
        uses: ./.github/actions/gcc16-env
      - name: Run the sanitizer leg
        run: ./scripts/ci-sanitizer.sh "${{ matrix.leg }}"

  fuzz-replay:
    # Every fuzz target builds and replays its checked-in seed corpus per pull
    # request, so the targets cannot rot between the long scheduled runs. The
    # fuzz-toolchain action is shared with nightly.yml's long-fuzz job because
    # libFuzzer needs the matching clang runtime.
    name: Fuzz corpus replay (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-21
      CXX: clang++-21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned fuzz toolchain
        uses: ./.github/actions/fuzz-toolchain
      - name: Replay the fuzz corpus
        run: ./scripts/ci-fuzz-replay.sh

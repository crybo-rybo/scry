name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # clang-format is pinned to 18: newer versions lay out reflection
      # annotations differently. clang-tidy 21 comes from apt.llvm.org because
      # Ubuntu's clang 18 cannot parse libstdc++'s <expected>.
      - name: Install clang-format and clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-21 g++-14 libcurl4-openssl-dev
      - run: ./scripts/format.sh --check
        env:
          CLANG_FORMAT: clang-format-18
      - run: ./scripts/lint.sh
        env:
          CLANG_TIDY: clang-tidy-21

  test:
    name: test (${{ matrix.preset }})
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan, tsan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GCC 16
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y g++-16 libcurl4-openssl-dev ninja-build
          # High-entropy ASLR breaks ASan/TSan shadow memory on these runners.
          sudo sysctl vm.mmap_rnd_bits=28
      - run: ./scripts/test.sh
        env:
          PRESET: ${{ matrix.preset }}

# Path-aware PR gate for the GCC 16 reflection component; see
# docs/development/quality-gates.md section 6.
#
# The full reflection leg — build, tests, staged install, both package
# consumers, and the ASan+UBSan rerun that is the component's only sanitizer
# coverage (QA-005) — runs on every pull request that touches a
# reflection-affecting path, so supported-component regressions cannot merge
# untested. Pull requests that do not touch these paths skip the experimental
# ppa:ubuntu-toolchain-r/test toolchain entirely. The unconditional weekly run
# lives in nightly.yml and catches toolchain drift on the same script.
name: Reflection

on:
  pull_request:
    paths:
      - "include/scry/**"
      - "src/**"
      - "tests/reflection/**"
      - "tests/package_consumer_reflection/**"
      - "tests/package_consumer/**"
      - "examples/reflection_tools.cpp"
      - "scripts/ci-reflection.sh"
      - "cmake/**"
      - "CMakeLists.txt"
      - "tests/CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/actions/reflection-env/**"
      - ".github/workflows/reflection.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reflection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reflection:
    name: GCC 16 supported reflection component
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: ./.github/actions/reflection-env
      - name: Build, test, install, and consume reflection component
        run: ./scripts/ci-reflection.sh
